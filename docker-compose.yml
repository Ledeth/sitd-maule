services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sitd_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sitd}
      POSTGRES_USER: ${POSTGRES_USER:-sitd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitd_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - sitd_pgdata:/var/lib/postgresql/data
      # Los .sql de db/init corren en orden alfabético SOLO en el primer arranque
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sitd} -d ${POSTGRES_DB:-sitd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: sitd_api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sitd}:${POSTGRES_PASSWORD:-sitd_dev_only}@db:5432/${POSTGRES_DB:-sitd}
      JWT_SECRET: ${JWT_SECRET:-cambiar_en_staging}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 480
    ports:
      - "8000:8000"
      # Puerto del frontend: se expone aquí porque el servicio 'frontend'
      # comparte la red de 'api' (network_mode: service:api).
      - "5173:5173"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/code
      # Carpeta donde el usuario deja los shapefiles/GPKG de INE y CONAF
      - ./data:/data:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: sitd_frontend
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    # Comparte red con la API para que el proxy de Vite (/api -> localhost:8000)
    # funcione sin configuración adicional.
    network_mode: "service:api"

volumes:
  sitd_pgdata:
